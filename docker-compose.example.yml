# KoalaTower behind an existing Caddy reverse proxy
#
# Usage:
#   docker compose -f docker-compose.example.yml up -d
#
# This example assumes you have a Caddy reverse proxy running on docker
# network "caddy_net" that handles TLS termination and domain routing.
#
# Example Caddyfile snippet:
#   koalatower.example.com {
#       reverse_proxy koala-tower:8080
#   }

services:
  koala-tower:
    image: ghcr.io/shik3i/koalatower:latest
    container_name: koala-tower
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_PATH: /data/flatland.db
      SESSION_SECRET: change-this-long-random-session-secret
      AUTH_PASSWORD_PEPPER: change-this-long-random-password-pepper
      KOFI_WEBHOOK_SECRET: change-this-if-kofi-webhook-is-enabled
      PUBLIC_ONLINE_FEATURES_ENABLED: "true"
    expose:
      - "8080"
    volumes:
      - koala-tower-data:/data
    networks:
      - caddy_net
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  caddy_net:
    external: true

volumes:
  koala-tower-data:
