name: Validate release version

# Runs ONLY on tag push. Release tags are immutable: the package version must
# already match the tag before the tag is pushed.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  bump:
    name: Sync package.json from tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "Tag:    v${TAG_VERSION}"
          echo "pkg:    ${PKG_VERSION}"

          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "ERROR: package.json version ${PKG_VERSION} does not match tag v${TAG_VERSION}." >&2
            echo "Update package.json, commit it, and create a new immutable tag." >&2
            exit 1
          fi

          echo "✅ package.json matches immutable tag v${TAG_VERSION}"
