name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version-guard:
    name: Version guard
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "Tag:    v${TAG_VERSION}"
          echo "pkg:    ${PKG_VERSION}"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}. Run: node -e \"const p=require('./package.json');p.version='${TAG_VERSION}';require('fs').writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n')\" && git add package.json && git commit --amend --no-edit && git tag -f v${TAG_VERSION} && git push --force-with-lease origin main && git push --force origin v${TAG_VERSION}"
            exit 1
          fi
          echo "✅ Tag matches package.json"

  check-and-test:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22+ is required for the test job: the renderer tests import
          # pixi.js, which reads a global `navigator` at module load. That
          # global only exists on Node 21+, so Node 20 fails with
          # "navigator is not defined". The Docker runtime (Node 20) runs no
          # tests and is validated by the docker-publish workflow instead.
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Build job mirrors the Docker runtime (Node 20). The prerender does
          # not import pixi.js, so the `navigator` global is not needed here.
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs: check-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # pixi.js (pulled in transitively by the build) reads a global
          # `navigator` at load, which only exists on Node 21+.
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
