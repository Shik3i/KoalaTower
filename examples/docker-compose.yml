# KoalaTower behind Caddy reverse proxy
#
# Usage:
#   docker compose -f examples/docker-compose.yml up -d
#
# This compose file assumes you have a Caddy reverse proxy running on
# the "caddy_net" Docker network that handles TLS termination.

services:
  koala-tower:
    image: ghcr.io/shik3i/koalatower:latest
    container_name: koala-tower
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - caddy_net
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  caddy_net:
    external: true
